name: Windows UI checks
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', '.github/workflows/windows-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-ui:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Input and target-selection checks
        run: dotnet run --project tests/PolicyChecks -c Release
      - name: Read-only real Windows account and UI checks
        run: dotnet run --project tests/WindowsUiChecks -c Release -- artifacts/ui-checks
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-evidence
          path: artifacts/ui-checks
          if-no-files-found: warn
